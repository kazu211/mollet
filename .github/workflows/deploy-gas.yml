name: Deploy GAS

on:
  push:
    branches:
      - main
    paths:
      - 'gas/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./gas
        run: npm install

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Create .clasp.json
        run: |
          echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"./src\"}" > ./gas/.clasp.json
        env:
          SCRIPT_ID: ${{ secrets.GAS_PROJECT_ID }}

      - name: Create .clasprc.json
        run: echo "$CLASPRC" > ~/.clasprc.json
        env:
          CLASPRC: ${{ secrets.CLASPRC }}

      - name: Deploy to GAS
        working-directory: ./gas
        run: clasp push --force
