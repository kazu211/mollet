name: Deploy GAS

on:
  push:
    branches:
      - main
    paths:
      - 'gas/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./gas
        run: npm install

      - name: Build TypeScript
        working-directory: ./gas
        run: npm run build

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Setup clasp configuration
        working-directory: ./gas
        run: |
          echo '{
            "scriptId": "${{ secrets.GAS_PROJECT_ID }}",
            "rootDir": "dist"
          }' > .clasp.json

      - name: Setup clasp authentication
        run: |
          echo '${{ secrets.GAS_CLASP_TOKEN }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Debug - Check clasprc.json
        run: |
          echo "=== File exists check ==="
          ls -la ~/.clasprc.json
          echo ""
          echo "=== File content ==="
          cat ~/.clasprc.json
          echo ""
          echo "=== File size ==="
          wc -c ~/.clasprc.json

      - name: Deploy to GAS
        working-directory: ./gas
        run: clasp push --force -v

